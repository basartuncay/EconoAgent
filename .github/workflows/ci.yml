name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src streamlit_app.py

      - name: Run tests
        run: pytest -v

      - name: Web demo boots
        run: |
          streamlit run streamlit_app.py --server.port 8501 &
          for i in $(seq 1 30); do curl -fs localhost:8501/_stcore/health && exit 0; sleep 1; done
          exit 1
